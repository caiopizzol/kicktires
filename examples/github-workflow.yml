name: kicktires

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: kicktires-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: kicktires
    if: >-
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kicktires]
    timeout-minutes: 35
    steps:
      - name: Review the pinned pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /opt/kicktires/bin/review-pr /etc/kicktires/profile.json
